<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rest API | Car Inventory</title>
    <link rel="stylesheet" href="./index.css" />
    <script src="./index.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Car Inventory</h1>

      <!-- display current cars -->
      <section class="inventory">
        <p>Current Inventory</p>

        <div id="car_inventory"></div>
      </section>

      <!-- add new car -->
      <section>
        <form id="add_car">
          <label for="plate">Registration Plate</label>
          <input type="text" id="plate" required />

          <label for="brand">Brand</label>
          <input type="text" id="brand" required />

          <label for="model">Model</label>
          <input type="text" id="model" required />

          <label for="year">Year</label>
          <input type="number" id="year" min="1886" required />

          <button type="submit">Add Car</button>

          <p id="message" role="status"></p>
        </form>
      </section>

      <!-- search for a car -->
      <section>
        <p>Looking for a car?</p>

        <form id="search_car">
          <input
            type="text"
            placeholder="Enter registration plate"
            id="search_plate"
            required
          />

          <button type="submit">Search</button>

          <p id="search_message" role="status"></p>
        </form>

        <div id="search_result"></div>
      </section>
    </main>
  </body>
</html>
